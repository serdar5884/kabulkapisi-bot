name: Veri indir (tek seferlik)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  indir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hadis kitapları (fawazahmed0/hadith-api)
        run: |
          git checkout --orphan veri
          git rm -rfq . || true
          mkdir -p hadis
          for b in bukhari muslim abudawud tirmidhi nasai ibnmajah; do
            for l in tur eng; do
              curl -sSfL -o hadis/$l-$b.json "https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/$l-$b.min.json" || echo "yok $l-$b"
            done
          done
          ls -la hadis
      - name: Kaydet (veri dalı)
        run: |
          git config user.name "kabulkapisi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add hadis
          git commit -qm "Hadis verisi"
          git push -f origin veri
